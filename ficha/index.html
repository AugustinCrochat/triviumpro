<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha técnica — Trivium Pro</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--bg:#eceae6;--bar:#111;--accent:#ff2a00}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#111}
.bar{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--bar);color:#fff}
.bar a,.bar button{cursor:pointer;color:#fff;text-decoration:none;font:600 .85rem system-ui,sans-serif;padding:8px 12px;border-radius:8px;border:1px solid #444;background:#222}
.bar a.pri{background:var(--accent);border-color:var(--accent)}.bar .t{flex:1;font-size:.85rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
.pg{position:relative;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.2);max-width:100%}
.pg canvas{display:block;width:100%;height:auto}.pg a.lnk{position:absolute;display:block}
#msg{padding:40px 20px;text-align:center}
</style>
</head>
<body>
<div class="bar"><a href="javascript:history.back()" aria-label="Volver">← Volver</a><span class="t" id="titulo">Ficha técnica</span><button type="button" id="sh">Compartir</button><a class="pri" id="dl" href="#" download>Descargar PDF</a></div>
<div id="msg">Cargando la ficha técnica…</div>
<div id="pages"></div>
<script src="../assets/js/pdfjs/pdf.min.js"></script>
<script>
(function () {
  var msg = document.getElementById('msg'), cont = document.getElementById('pages');
  var f = new URLSearchParams(location.search).get('f') || '';
  // Solo PDFs propios del sitio: nada de URLs externas ni rutas fuera de assets/pdf/.
  if (!/^\/?assets\/pdf\/[A-Za-z0-9._-]+\.pdf$/.test(f)) { msg.textContent = 'No se encontró la ficha técnica.'; return; }
  var url = '/' + f.replace(/^\//, '');
  var dl = document.getElementById('dl'); dl.href = url; dl.setAttribute('download', f.split('/').pop());
  // Compartir igual que en la ficha del producto: menú nativo del dispositivo con el PDF adjunto; si el
  // navegador no puede adjuntar archivos comparte el enlace, y si no hay menú nativo abre WhatsApp.
  var abs = location.origin + url, texto = 'Ficha técnica — Trivium Pro';
  document.getElementById('sh').addEventListener('click', async function () {
    try {
      if (navigator.canShare && navigator.share) {
        var r = await fetch(url);
        var file = new File([await r.blob()], f.split('/').pop(), { type: 'application/pdf' });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: texto, text: texto }); return; }
      }
      if (navigator.share) { await navigator.share({ title: texto, text: texto, url: abs }); return; }
    } catch (err) { if (err && err.name === 'AbortError') return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(texto + '\n' + abs), '_blank', 'noopener');
  });
  if (new URLSearchParams(location.search).get('a') === 'descargar') setTimeout(function () { dl.click(); }, 300);
  document.getElementById('titulo').textContent = f.split('/').pop().replace(/\.pdf$/, '').replace(/-/g, ' ');
  if (!window.pdfjsLib) { location.replace(url); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = '../assets/js/pdfjs/pdf.worker.min.js';
  var vencio = setTimeout(function () { msg.innerHTML = 'No se pudo abrir el visor. <a href="' + url + '">Abrir o descargar el PDF</a>'; }, 12000);
  pdfjsLib.getDocument(url).promise.then(function (pdf) {
    clearTimeout(vencio); msg.remove();
    var ancho = Math.min(window.innerWidth - 24, 900), dpr = Math.min(window.devicePixelRatio || 1, 3);
    var chain = Promise.resolve();
    for (let n = 1; n <= pdf.numPages; n++) {
      chain = chain.then(function () { return pdf.getPage(n).then(function (page) {
        var base = page.getViewport({ scale: 1 }), escala = ancho / base.width;
        var vp = page.getViewport({ scale: escala * dpr }), vpCss = page.getViewport({ scale: escala });
        var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
        var box = document.createElement('div'); box.className = 'pg'; box.style.width = vpCss.width + 'px';
        box.appendChild(cv); cont.appendChild(box);
        var render = page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        return render.then(function () { return page.getAnnotations(); }).then(function (anns) {
          anns.forEach(function (a) {
            if (a.subtype !== 'Link' || !a.url) return;
            var r = vpCss.convertToViewportRectangle(a.rect);
            var l = document.createElement('a'); l.className = 'lnk'; l.href = a.url; l.target = '_blank'; l.rel = 'noopener';
            l.style.left = Math.min(r[0], r[2]) + 'px'; l.style.top = Math.min(r[1], r[3]) + 'px';
            l.style.width = Math.abs(r[2] - r[0]) + 'px'; l.style.height = Math.abs(r[3] - r[1]) + 'px';
            box.appendChild(l);
          });
        });
      }); });
    }
  }).catch(function () { location.replace(url); });
})();
</script>
</body>
</html>
