<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/assets/img/icono-trivium.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tv-root" content="../../">
<title>Instalamos tres elevadores de dos columnas para Punto Flash — Trivium Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/styles.css">
<style>
  .post-header { padding: 60px 0 40px; text-align: center; border-bottom: 1px solid var(--line); }
  .post-header h1 { font-size: clamp(2rem, 4.5vw, 3.5rem); max-width: 22ch; margin: 18px auto; line-height: 1.05; }
  .post-header .meta { font-family: var(--mono); text-transform: uppercase; letter-spacing: .15em; color: var(--text-mute); font-size: .8rem; }
  
  .post-main { display: grid; grid-template-columns: 1fr 800px 1fr; gap: 40px; padding: 60px 0 100px; }
  .post-content { grid-column: 2; font-size: 1.12rem; line-height: 1.7; color: var(--text-dim); }
  .post-content h2, .post-content h3 { color: var(--text); margin: 40px 0 16px; text-transform: uppercase; }
  .post-content p { margin-bottom: 24px; }
  .post-content img { border: 1px solid var(--line); margin: 32px 0; width: 100%; height: auto; }
  .post-content ul, .post-content ol { margin-bottom: 24px; padding-left: 20px; }
  .post-content li { margin-bottom: 10px; }
  .post-content blockquote { border-left: 4px solid var(--accent); padding: 20px 30px; background: var(--bg-2); font-style: italic; margin: 32px 0; color: var(--text); }
  
  @media (max-width: 900px) {
    .post-main { grid-template-columns: 1fr; padding: 40px 0 80px; }
    .post-content { grid-column: 1; padding: 0 20px; }
  }
</style>
<meta property="og:type" content="article">
<meta property="og:site_name" content="Trivium Center">
<meta property="og:title" content="Instalamos tres elevadores de dos columnas para Punto Flash">
<meta property="og:description" content="En Trivium Center, seguimos apostando por la innovación y la excelencia técnica en cada proyecto.Recientemente, completamos la instalación de tres elevadores de">
<meta property="og:image" content="https://trivium.ar/assets/img/blog/instalamos-tres-elevadores-de-dos-columnas-para-punto-flash.webp">
<meta property="og:url" content="https://trivium.ar/blog/instalamos-tres-elevadores-de-dos-columnas-para-punto-flash/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Instalamos tres elevadores de dos columnas para Punto Flash">
<meta name="twitter:description" content="En Trivium Center, seguimos apostando por la innovación y la excelencia técnica en cada proyecto.Recientemente, completamos la instalación de tres elevadores de">
<meta name="twitter:image" content="https://trivium.ar/assets/img/blog/instalamos-tres-elevadores-de-dos-columnas-para-punto-flash.webp">
</head>
<body>
<div id="site-header"></div>

<article id="post-view">
  <header class="post-header">
    <div class="container">
      <div class="breadcrumbs" id="crumbs"></div>
      <div class="meta" id="post-date"></div>
      <h1 id="post-title"></h1>
    </div>
  </header>

  <div class="post-main">
    <div class="post-content" id="post-content">
      <!-- Contenido dinámico -->
    </div>
  </div>
</article>

<section class="section" style="background:var(--bg-2)">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">Más noticias</span>
        <h2 style="margin-top:14px">Otras notas del <span style="color:var(--accent)">blog.</span></h2>
      </div>
    </div>
    <div class="prod-grid" id="more-posts"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="../../assets/js/site.js"></script>
<script>
mountChrome('blog');
(async () => {
  await loadBlog();
  const slug = getQuery('id');
  const post = BLOG_DATA.find(x => x.slug === slug);
  
  if (!post) {
    document.getElementById('post-content').innerHTML = '<p>Artículo no encontrado. <a href="blog.html" style="color:var(--accent)">Volver al blog</a>.</p>';
    return;
  }
  
  document.title = `${post.title} — Trivium Center`;
  const dateStr = new Date(post.date).toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' });
  
  document.getElementById('post-title').innerText = post.title;
  document.getElementById('post-date').innerText = dateStr;
  document.getElementById('post-content').innerHTML = post.content;
  
  document.getElementById('crumbs').innerHTML = `
    <a href="${root}">Inicio</a><span>/</span>
    <a href="${root}blog/">Blog</a><span>/</span>
    ${post.title}
  `;

  // Más noticias (excluyendo la actual)
  const others = BLOG_DATA
    .filter(x => x.id !== post.id)
    .sort(() => .5 - Math.random())
    .slice(0, 4);
  renderBlogGrid('#more-posts', others);
})();
</script>
</body>
</html>
