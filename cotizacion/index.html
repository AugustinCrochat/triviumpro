<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="tv-root" content="../">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192">
<link rel="icon" type="image/svg+xml" href="/assets/img/icono-trivium.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Cotización — Trivium Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css?v=20261022b">
<style>
  body { background: var(--bg-2); }
  .q-top { position: sticky; top: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
  .q-top-inner { max-width: 960px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  .q-logo { height: 32px; }
  .q-top b { font-size: 15px; font-weight: 800; }
  .q-actions { margin-left: auto; display: flex; gap: 8px; }
  .q-btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 10px 16px; border-radius: var(--radius); text-decoration: none; border: 1px solid var(--line); background: var(--bg-3); color: var(--text); }
  .q-btn:hover { background: var(--surface-hi); }
  .q-btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .q-btn--primary:hover { background: var(--accent-hi); }
  .q-btn svg { width: 16px; height: 16px; }

  .q-wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
  .q-doc { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
  .q-head { padding: 28px 32px; border-bottom: 3px solid var(--accent); display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .q-head img { height: 40px; }
  .q-head .meta { margin-left: auto; text-align: right; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .q-head h1 { font-size: 26px; font-weight: 800; margin: 6px 0 0; letter-spacing: -.02em; }

  .q-item { display: flex; gap: 18px; padding: 20px 32px; border-bottom: 1px solid var(--line); align-items: center; }
  .q-item .thumb { width: 120px; height: 90px; flex: none; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); display: grid; place-items: center; padding: 6px; overflow: hidden; }
  .q-item .thumb img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  .q-item .info { flex: 1; min-width: 0; }
  .q-item .info h3 { font-size: 16px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .q-item .info a { color: inherit; text-decoration: none; }
  .q-item .info a:hover { color: var(--accent); }
  .q-item .info p { font-size: 13px; color: var(--text-dim); margin: 0; line-height: 1.4; }
  .q-item .info .sku { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
  .q-item .price { text-align: right; flex: none; }
  .q-item .price .val { font-size: 20px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .q-item .price .iva { font-size: 12px; font-weight: 800; color: var(--accent); }

  .q-totals { padding: 22px 32px; background: var(--bg-2); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .q-totals .row { display: flex; gap: 40px; font-size: 14px; color: var(--text-dim); min-width: 320px; justify-content: space-between; }
  .q-totals .row.total { font-size: 22px; font-weight: 800; color: var(--text); border-top: 1px solid var(--line-2); padding-top: 10px; margin-top: 4px; }
  .q-totals .row b { color: var(--text); font-weight: 700; }

  .q-note { padding: 20px 32px; font-size: 12px; color: var(--text-mute); line-height: 1.6; }
  .q-empty { text-align: center; padding: 80px 24px; color: var(--text-dim); }
  .q-empty h2 { font-size: 20px; margin: 0 0 8px; color: var(--text); }

  #q-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: #1c1c1c; color: #fff; padding: 12px 20px; border-radius: 100px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 100; }
  #q-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .q-item { flex-wrap: wrap; }
    .q-item .price { text-align: left; width: 100%; }
    .q-head .meta { margin-left: 0; text-align: left; width: 100%; }
  }
  @media print {
    /* margin 0 en @page evita que el navegador imprima URL, fecha y "1 of 1" en los márgenes */
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .q-top, .q-actions { display: none !important; }
    .q-wrap { padding: 12mm !important; max-width: none; }
    .q-doc { border: 0; }
    .q-item, .q-head, .q-totals { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="q-top">
  <div class="q-top-inner">
    <img class="q-logo" src="../assets/img/marcas/logo-trivium-pro.svg" alt="Trivium Pro"
         onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'Trivium Pro'}))">
    <b>Cotización</b>
    <div class="q-actions" id="q-actions" style="display:none">
      <button class="q-btn" onclick="shareLink()" title="Compartir el link de esta cotización">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        Link
      </button>
      <button class="q-btn" onclick="shareImage()" title="Compartir la cotización como imagen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5a2 2 0 0 0-3 0L5 21"/></svg>
        Imagen
      </button>
      <button class="q-btn q-btn--primary" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        PDF
      </button>
    </div>
  </div>
</div>

<div class="q-wrap" id="q-wrap"><div class="q-empty">Cargando…</div></div>

<script src="../assets/js/site.js?v=20261022b"></script>
<script>
const fmtARS = (n) => '$ ' + new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 }).format(Math.round(n));
const ivaLbl = (r) => (Number.isInteger(r) ? r : String(r).replace('.', ',')) + '%';
function decodeQuote(str) { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
function fichaUrl(slug) { return `${location.origin}/producto/${encodeURIComponent(slug)}/`; }

let QITEMS = [];      // [{s,p,c,i}] con datos del producto resueltos
const today = new Date().toLocaleDateString('es-AR');

function getItems() {
  const m = location.hash.match(/q=([^&]+)/);
  if (!m) return null;
  try { const arr = decodeQuote(decodeURIComponent(m[1])); return Array.isArray(arr) ? arr : null; }
  catch (e) { return null; }
}
function ivaRateOf(it) { return (it.i != null ? it.i : 10.5) / 100; }
function totals() {
  const subtotal = QITEMS.reduce((a, it) => a + (Number(it.p) || 0), 0);
  const iva = QITEMS.reduce((a, it) => a + (Number(it.p) || 0) * ivaRateOf(it), 0);
  const rates = [...new Set(QITEMS.map(it => it.i != null ? it.i : 10.5))];
  const ivaLabel = rates.length === 1 ? `IVA ${ivaLbl(rates[0])}` : 'IVA (según equipo)';
  return { subtotal, iva, total: subtotal + iva, ivaLabel };
}

/* ---------- Compartir ---------- */
async function shareLink() {
  const url = location.href, title = 'Cotización — Trivium Pro';
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url); toast('Link copiado');
  } catch (e) {}
}
async function shareImage() {
  toast('Generando imagen…');
  const blob = await canvasToBlob(await buildQuoteImage());
  const file = new File([blob], 'cotizacion-trivium-pro.png', { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Cotización — Trivium Pro' }); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'cotizacion-trivium-pro.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- Imagen de la cotización (canvas) ---------- */
function loadImg(src) { return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function canvasToBlob(c) { return new Promise((res) => c.toBlob(res, 'image/png')); }
function clip(ctx, text, maxW) {
  let t = String(text);
  if (ctx.measureText(t).width <= maxW) return t;
  while (t.length && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
async function buildQuoteImage() {
  const rowH = 200, headH = 160, t = totals();
  const H = headH + QITEMS.length * rowH + 240 + 70;
  const W = 1080, c = document.createElement('canvas');
  c.width = W; c.height = H; const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  // header
  ctx.fillStyle = '#ff1e00'; ctx.fillRect(0, 0, W, headH);
  ctx.fillStyle = '#fff'; ctx.font = '800 46px Archivo, sans-serif'; ctx.fillText('TRIVIUM PRO', 48, 72);
  ctx.font = '600 26px Archivo, sans-serif'; ctx.fillText('Cotización', 48, 116);
  ctx.textAlign = 'right'; ctx.font = '600 24px Archivo, sans-serif';
  ctx.fillText(`${today}  ·  ${QITEMS.length} ${QITEMS.length === 1 ? 'equipo' : 'equipos'}`, W - 48, 100);
  ctx.textAlign = 'left';
  // items
  const imgs = await Promise.all(QITEMS.map(it => loadImg(rootPath() + ((it._p && it._p.image) || ''))));
  let y = headH;
  QITEMS.forEach((it, idx) => {
    const p = it._p || {};
    const im = imgs[idx];
    const tx = 48, tw = 200, th = 150, ty = y + 25;
    if (im) { const r = Math.min(tw / im.width, th / im.height); const iw = im.width * r, ih = im.height * r; ctx.drawImage(im, tx + (tw - iw) / 2, ty + (th - ih) / 2, iw, ih); }
    else { ctx.fillStyle = '#f0ede8'; ctx.fillRect(tx, ty, tw, th); }
    const nx = 280, nmax = 470;
    ctx.fillStyle = '#1c1c1c'; ctx.font = '700 32px Archivo, sans-serif';
    ctx.fillText(clip(ctx, p.name || it.s, nmax), nx, y + 78);
    ctx.fillStyle = '#57534e'; ctx.font = '400 24px Archivo, sans-serif';
    if (it.c) ctx.fillText(clip(ctx, it.c, nmax), nx, y + 116);
    ctx.fillStyle = '#a8a29e'; ctx.font = '600 20px Archivo, sans-serif';
    ctx.fillText('SKU ' + it.s, nx, y + 150);
    // price right
    ctx.textAlign = 'right';
    ctx.fillStyle = '#1c1c1c'; ctx.font = '800 38px Archivo, sans-serif'; ctx.fillText(fmtARS(it.p), W - 48, y + 92);
    ctx.fillStyle = '#ff1e00'; ctx.font = '800 24px Archivo, sans-serif'; ctx.fillText('+ IVA ' + ivaLbl(it.i != null ? it.i : 10.5), W - 48, y + 128);
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#e4e0d8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(48, y + rowH); ctx.lineTo(W - 48, y + rowH); ctx.stroke();
    y += rowH;
  });
  // totals
  const by = y + 20;
  ctx.fillStyle = '#f7f6f3'; ctx.fillRect(48, by, W - 96, 200);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#57534e'; ctx.font = '600 26px Archivo, sans-serif';
  ctx.fillText('Subtotal (sin IVA)', W - 300, by + 52); ctx.fillStyle = '#1c1c1c'; ctx.fillText(fmtARS(t.subtotal), W - 80, by + 52);
  ctx.fillStyle = '#57534e'; ctx.fillText(t.ivaLabel, W - 300, by + 96); ctx.fillStyle = '#1c1c1c'; ctx.fillText(fmtARS(t.iva), W - 80, by + 96);
  ctx.fillStyle = '#1c1c1c'; ctx.font = '800 40px Archivo, sans-serif';
  ctx.fillText('Total', W - 300, by + 158); ctx.fillText(fmtARS(t.total), W - 80, by + 158);
  ctx.textAlign = 'left';
  // footer
  ctx.fillStyle = '#a8a29e'; ctx.font = '600 22px Archivo, sans-serif';
  ctx.fillText(`Trivium Pro · ${TRIVIUM.whatsappDisplay} · válida al ${today}`, 48, H - 28);
  return c;
}

function toast(msg) {
  let t = document.getElementById('q-toast');
  if (!t) { t = document.createElement('div'); t.id = 'q-toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'show';
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 2200);
}

/* ---------- Render ---------- */
(async () => {
  await loadCatalog();
  const raw = getItems();
  const wrap = document.getElementById('q-wrap');
  if (!raw || !raw.length) {
    wrap.innerHTML = `<div class="q-empty"><h2>Cotización vacía</h2><p>Este link no contiene equipos. Armá una cotización desde la lista de precios.</p></div>`;
    return;
  }
  const byId = {}; CATALOG.products.forEach(p => { byId[p.sku] = p; });
  QITEMS = raw.map(it => ({ ...it, _p: byId[it.s] || {} }));

  const rows = QITEMS.map(it => {
    const p = it._p;
    const isLift = (p.category || '').includes('elevador');
    const specParts = [];
    if (isLift && p.capacity) specParts.push(`Cap. ${p.capacity}`);
    if (isLift && p.lift_height) specParts.push(`Alt. ${p.lift_height}`);
    const img = p.image ? `<img src="${rootPath()}${p.image}" alt="" onerror="this.remove()">` : '';
    const name = p.name || it.s;
    const nameHtml = p.slug ? `<a href="${fichaUrl(p.slug)}" target="_blank" rel="noopener">${name}</a>` : name;
    return `
      <div class="q-item">
        <div class="thumb">${img}</div>
        <div class="info">
          <h3>${nameHtml}</h3>
          ${it.c ? `<p>${it.c}</p>` : ''}
          <p class="sku">${specParts.join(' · ')}${specParts.length ? ' · ' : ''}SKU ${it.s}</p>
        </div>
        <div class="price">
          <div class="val">${fmtARS(it.p)}</div>
          <div class="iva">+ IVA ${ivaLbl(it.i != null ? it.i : 10.5)}</div>
        </div>
      </div>`;
  }).join('');

  const t = totals();
  document.getElementById('q-actions').style.display = 'flex';
  wrap.innerHTML = `
    <div class="q-doc">
      <div class="q-head">
        <img src="${rootPath()}assets/img/marcas/logo-trivium-pro.svg" alt="Trivium Pro" onerror="this.remove()">
        <div><h1>Cotización</h1></div>
        <div class="meta">
          Fecha: <b>${today}</b><br>
          ${QITEMS.length} ${QITEMS.length === 1 ? 'equipo' : 'equipos'}<br>
          Precios en pesos
        </div>
      </div>
      ${rows}
      <div class="q-totals">
        <div class="row"><span>Subtotal (sin IVA)</span><b>${fmtARS(t.subtotal)}</b></div>
        <div class="row"><span>${t.ivaLabel}</span><b>${fmtARS(t.iva)}</b></div>
        <div class="row total"><span>Total</span><span>${fmtARS(t.total)}</span></div>
      </div>
      <div class="q-note">
        Precios expresados en pesos argentinos. Cotización válida a la fecha de emisión, sujeta a modificación sin previo aviso y a confirmación de stock.
        Trivium Pro · ${TRIVIUM.whatsappDisplay} · ${TRIVIUM.email}
      </div>
    </div>`;
})();
</script>
</body>
</html>
