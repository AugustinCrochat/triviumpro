<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tv-root" content="">
<title>Blog y Noticias — Trivium Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<section class="cat-hero">
  <div class="container">
    <div class="breadcrumbs"><a href="index.html">Inicio</a><span>/</span> Blog</div>
    <h1>Noticias y<br><span style="color:var(--accent)">Actualidad Técnica.</span></h1>
    <p style="color:var(--text-dim);margin-top:14px;max-width:60ch;">Novedades del sector, consejos de mantenimiento, casos de éxito e instalaciones de equipamiento en toda Argentina.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="prod-grid" id="blog-grid">
      <!-- Se carga dinámicamente -->
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/site.js"></script>
<script>
mountChrome('blog');
(async () => {
  await loadBlog();
  // Ordenar por fecha (más recientes primero)
  const posts = BLOG_DATA.sort((a,b) => new Date(b.date) - new Date(a.date));
  renderBlogGrid('#blog-grid', posts);
})();
</script>
</body>
</html>
