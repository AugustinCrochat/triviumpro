<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/assets/img/icono-trivium.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tv-root" content="../">
<title>Marcas — Trivium Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .brand-card {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 36px;
    display: grid; grid-template-columns: 1fr 2fr; gap: 32px;
    align-items: center;
  }
  .brand-card + .brand-card { margin-top: 18px; }
  .brand-logo {
    aspect-ratio: 4/3;
    background: var(--bg-3);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-family: var(--display);
    text-transform: uppercase;
    font-size: 1.8rem;
    text-align: center;
    letter-spacing: -.01em;
  }
  .brand-logo--img {
    background: var(--bg-2);
    padding: 24px;
  }
  .brand-logo--img img {
    width: 100%;
    height: auto;
    max-height: 100px;
    object-fit: contain;
    display: block;
  }
  .brand-card h2 { font-family: var(--display); text-transform: uppercase; font-size: 2rem; margin-bottom: 8px; }
  .brand-card .origin { font-family: var(--mono); font-size: .72rem; color: var(--accent); letter-spacing:.2em; text-transform: uppercase; }
  @media (max-width: 700px) { .brand-card { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="site-header"></div>

<section class="cat-hero">
  <div class="container">
    <div class="breadcrumbs"><a href="../">Inicio</a><span>/</span> Marcas</div>
    <h1>Marcas que<br><span style="color:var(--accent)">representamos.</span></h1>
    <p style="color:var(--text-dim);margin-top:14px;max-width:60ch;">Somos distribuidores oficiales. Cada marca fue elegida por su calidad, respaldo técnico y disponibilidad de repuestos originales.</p>
  </div>
</section>

<section class="section">
  <div class="container" id="brand-detail-list"></div>
</section>

<div id="site-footer"></div>
<script src="../assets/js/site.js"></script>
<script>
mountChrome('marcas');
const BRAND_INFO = {
  'rotary-lift':  { origin: 'USA · Madison, IN', desc: 'Líder mundial en elevadores hidráulicos desde 1925. Estándar de calidad de la industria automotriz. Somos distribuidores oficiales en Argentina.' },
  'hofmann':      { origin: 'Snap-On USA/Italia', desc: 'Hofmann es la marca premium de Snap-on para alineadoras 3D, balanceadoras y soluciones para servicio de neumáticos. Tecnología y precisión de primer nivel.' },
  'direct-lift':  { origin: 'USA · Kentucky', desc: 'Elevadores tijera y portátiles para talleres y garajes. Enfocados en diseños compactos con instalación simplificada.' },
  'forward-lift': { origin: 'USA · Indiana', desc: 'Especialistas en elevadores para camiones, buses y vehículos pesados. Soluciones móviles y fijas de gran capacidad.' },
  'trivium-pro':  { origin: 'Marca propia · Argentina', desc: 'Nuestra línea propia de equipos seleccionados y validados por Trivium. Excelente relación precio-calidad con respaldo local de posventa y repuestos.' }
};

(async () => {
  await loadCatalog();
  const list = document.getElementById('brand-detail-list');
  const root = '../';
  list.innerHTML = CATALOG.brands.map(b => {
    const info = BRAND_INFO[b.slug] || { origin: b.note, desc: '' };
    const logo = BRAND_LOGOS[b.slug];
    const count = CATALOG.products.filter(p => p.brand === b.slug).length;
    const logoHtml = logo
      ? `<div class="brand-logo brand-logo--img"><img src="${root}${logo}" alt="${b.name}"></div>`
      : `<div class="brand-logo">${b.name}</div>`;
    return `
      <div class="brand-card">
        ${logoHtml}
        <div>
          <span class="origin">${info.origin}</span>
          <h2>${b.name}</h2>
          <p>${info.desc}</p>
          <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
            <a class="btn btn--primary" href="${brandUrl(b.slug)}">Ver productos (${count})</a>
            <a class="btn btn--ghost" href="${waLink('Hola, quiero info sobre productos '+b.name)}">Consultar</a>
          </div>
        </div>
      </div>`;
  }).join('');
})();
</script>
</body>
</html>
