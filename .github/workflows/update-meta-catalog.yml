name: Update Meta catalog feed

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC = 05:00 ART (Argentina no tiene horario de verano)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate feed
        run: python3 scripts/generate_meta_catalog.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- feeds/meta-catalogo.csv; then
            git add feeds/meta-catalogo.csv
            git commit -m "chore: update meta catalog feed prices [automated]"
            git push
          else
            echo "Sin cambios en el feed (dólar sin variación relevante)"
          fi
