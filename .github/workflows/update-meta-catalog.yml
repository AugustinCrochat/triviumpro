name: Update catalog feeds and prices

# Los precios en pesos salen del dólar oficial del día. Todos los lugares donde
# se publican tienen que moverse juntos: los feeds de Meta y de Google Merchant
# Center, y el HTML prerenderizado de fichas, categorías y guías (de ahí leen el
# precio los buscadores y el schema Offer). Google Merchant compara el precio del
# feed con el de la ficha y rechaza los productos que no coinciden, así que no
# alcanza con regenerar sólo los feeds.

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC = 05:00 ART (Argentina no tiene horario de verano)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Si dolarapi no responde, los scripts usan un valor de referencia fijo y
      # publicarían precios desfasados. Mejor no tocar nada que publicar eso.
      - name: Check dollar API
        run: curl -fsS --max-time 15 https://dolarapi.com/v1/dolares/oficial | grep -q '"venta"'

      - name: Generate feeds and priced pages
        run: |
          python3 scripts/generate_meta_catalog.py
          python3 scripts/generate_pretty_urls.py
          python3 scripts/generate_guias.py
          python3 scripts/generate_sitemap.py
          python3 scripts/generate_llms_full.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds producto categoria marca guias sitemap.xml llms-full.txt scripts/sitemap-lastmod.json
          if git diff --cached --quiet; then
            echo "Sin cambios (dólar sin variación relevante)"
          else
            git commit -m "chore: update feeds and prices [automated]"
            git push
          fi
