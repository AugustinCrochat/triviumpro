<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #eee; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .card { background: #fff; padding: 10px; border: 1px solid #ccc; text-align: center; }
  img { width: 100px; height: 100px; border: 1px solid red; }
</style>
</head>
<body>
<div class="grid">
  <div class="card"><h3>elevadores</h3><img src="assets/img/iconos/elevadores.svg"></div>
  <div class="card"><h3>alineadoras</h3><img src="assets/img/iconos/alineadoras.svg"></div>
  <div class="card"><h3>balanceadoras</h3><img src="assets/img/iconos/balanceadoras.svg"></div>
  <div class="card"><h3>desarmadoras</h3><img src="assets/img/iconos/desarmadoras.svg"></div>
</div>
</body>
</html>
