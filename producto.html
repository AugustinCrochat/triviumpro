<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192">
<link rel="icon" type="image/svg+xml" href="/assets/img/icono-trivium.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tv-root" content="">
<title>Ficha de producto — Trivium Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="assets/css/styles.css?v=20261022h">
<link rel="stylesheet" href="assets/css/guia.css?v=20261022h">
<link rel="stylesheet" href="assets/css/tienda.css?v=20261022h">
</head>
<body>
<div id="site-header"></div>

<section>
  <div class="container">
    <div id="pd-back-folleto"></div>
    <div class="breadcrumbs" id="crumbs" style="margin-top:24px"></div>
    <div class="pd-wrap" id="pd-wrap"></div>
  </div>
</section>

<section class="section" style="background:var(--bg-2)">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">Relacionados</span>
        <h2 style="margin-top:14px">Te puede <span style="color:var(--accent)">interesar.</span></h2>
      </div>
    </div>
    <div class="prod-grid" id="related"></div>
  </div>
</section>

<section class="cat-blog-links" id="pd-guide"></section>

<div id="site-footer"></div>
<script src="assets/js/site.js?v=20261022h"></script>
<script src="assets/js/zoom.js?v=20261022h"></script>
<script src="assets/js/tienda.js?v=20261022h"></script>
<script>
mountChrome('catalogo');

// Si se llegó acá desde el folleto (catálogo imprimible o un link de
// selección compartido), un botón para volver evita depender del botón
// "atrás" del navegador — y como usa el referrer completo, vuelve a la
// misma selección/filtro en la que estaba, no al folleto en blanco.
try {
  const ref = document.referrer;
  if (ref) {
    const refUrl = new URL(ref);
    if (refUrl.origin === location.origin && /^\/folleto-/.test(refUrl.pathname)) {
      document.getElementById('pd-back-folleto').innerHTML =
        `<a class="pd-back-link" href="${ref}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Volver al folleto</a>`;
    }
  }
} catch (e) {}

(async () => {
  await loadCatalog();
  const slug = getQuery('id');
  const p = CATALOG.products.find(x => x.slug === slug);
  if (!p) {
    document.getElementById('pd-wrap').innerHTML = `<p>Producto no encontrado. <a href="${rootPath()}catalogo/" style="color:var(--accent)">Volver al catálogo</a>.</p>`;
    return;
  }
  document.title = `${p.name} — Trivium Pro`;
  const cat = categoryById(p.category);
  const parent = cat.parent ? categoryById(cat.parent) : null;
  const brand = brandById(p.brand);

  document.getElementById('crumbs').innerHTML = `
    <a href="${rootPath()}">Inicio</a><span>/</span>
    <a href="${rootPath()}catalogo/">Catálogo</a><span>/</span>
    ${parent ? `<a href="${categoryUrl(parent.slug)}">${parent.name}</a><span>/</span>` : ''}
    <a href="${categoryUrl(cat.slug)}">${cat.name}</a><span>/</span>
    ${p.name}
  `;

  const msg = `Hola Trivium, me interesa el ${p.name} (SKU ${p.sku}). ¿Me pasan precio y disponibilidad?`;
  // Extract PDF and video links from html_description
  let pdfHref = null, videoHref = null;
  if (p.html_description) {
    const tmp = document.createElement('div');
    tmp.innerHTML = p.html_description;
    const pdfA = tmp.querySelector('.product-page-btn-pdf');
    const videoA = tmp.querySelector('.product-page-btn-video');
    if (pdfA) {
      pdfHref = pdfA.getAttribute('href');
      if (pdfHref && !pdfHref.startsWith('http') && !pdfHref.startsWith('/'))
        pdfHref = rootPath() + pdfHref;
    }
    if (videoA) videoHref = videoA.getAttribute('href');
  }

  // Fotos de la galería (hasta 6); si el producto no tiene lista, solo la principal.
  const galleryImgs = (p.images && p.images.length ? p.images : (p.image ? [p.image] : [])).slice(0, 6);

  document.getElementById('pd-wrap').innerHTML = `
    <div class="pd-gallery">
      ${originBadgeHtml(p, true)}
      <div class="main" id="pd-main">
        ${p.image
          ? `<img src="${rootPath()}${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:contain;background:#fff" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span style="display:none">Imagen / ${p.sku}</span>`
          : `<span>Imagen / ${p.sku}</span>`}
      </div>
      ${galleryImgs.length > 1 ? `
      <div class="thumbs">
        ${galleryImgs.map((src,i) => `
          <button type="button" class="thumb ${i===0?'active':''}" style="background:#fff;padding:4px" aria-label="Ver imagen ${i+1} de ${galleryImgs.length}">
            <img src="${rootPath()}${src}" alt="" style="width:100%;height:100%;object-fit:contain">
          </button>`).join('')}
      </div>` : ''}
    </div>
    <div class="pd-info">
      <div class="brand-line">
        ${brand.logo
          ? `<a class="brand-chip" href="${rootPath()}marca/${brand.slug}/" title="${brand.name}"><img src="${rootPath()}${brand.logo}" alt="${brand.name}"></a>`
          : `<span class="chip chip--accent">${brand.name}</span>`}
      </div>
      <h1>${p.name}</h1>
      <span class="sku">SKU · ${p.sku}</span>
      <div id="pd-price"></div>

      ${p.category.includes('elevador') ? `
      <div class="pd-spec-tiles">
        ${p.capacity ? `<div class="pd-spec-tile"><div class="tile-label">Capacidad</div><div class="tile-value">${p.capacity}</div></div>` : ''}
        ${p.lift_height ? `<div class="pd-spec-tile"><div class="tile-label">Altura de elevación</div><div class="tile-value">${p.lift_height}</div></div>` : ''}
      </div>` : ''}

      ${typeof aliCertHtml === 'function' ? aliCertHtml(p) : ''}

      ${(pdfHref || videoHref) ? `
      <div class="pd-actions">
        ${videoHref ? `<a class="btn btn--primary btn--lg" href="${videoHref}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0"><polygon points="5,3 19,12 5,21 5,3"/></svg>
          Ver video
        </a>` : ''}
        ${pdfHref ? `<div class="pd-ficha-group">
          <a class="pd-ficha-main" href="${pdfHref}" target="_blank" rel="noopener">
            <span class="pd-ficha-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg></span>
            <span class="pd-ficha-tx">Ficha Técnica<small>PDF · datos y medidas</small></span>
          </a>
          <a class="pd-ficha-seg" href="${pdfHref}" download title="Descargar ficha" aria-label="Descargar ficha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </a>
          <button type="button" class="pd-ficha-seg" data-share-ficha="${pdfHref}" title="Compartir ficha" aria-label="Compartir ficha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
          </button>
        </div>` : ''}
      </div>
` : ''}

      ${(p.bullets && p.bullets.length) ? `
      <ul class="pd-bullets">
        ${p.bullets.map(b => `<li>${b.replace(/\s+([,.;:])/g, '$1')}</li>`).join('')}
      </ul>` : ''}

    </div>
  `;
  if (galleryImgs.length) initGalleryZoom(galleryImgs.map(src => rootPath() + src));

  if (p.html_description) {
    const wrap = document.getElementById('pd-wrap');
    const descEl = document.createElement('div');
    descEl.className = 'rich-html';
    descEl.style.gridColumn = '1 / -1';
    descEl.style.marginTop = '20px';
    
    // Fix relative paths in WooCommerce HTML
    let html = p.html_description;
    const root = rootPath();
    if (root) {
      html = html.replace(/href="assets\//g, `href="${root}assets/`);
      html = html.replace(/src="assets\//g, `src="${root}assets/`);
    }
    descEl.innerHTML = html;
    const btnContainer = descEl.querySelector('.product-page-button-container');
    if (btnContainer) btnContainer.style.display = 'none';
    const titleEl = descEl.querySelector('.product-page-title');
    if (titleEl) titleEl.style.display = 'none';
    wrap.appendChild(descEl);
  }

  // Update floating WhatsApp button with product-specific message
  const floatBtn = document.querySelector('.wa-float');
  if (floatBtn) floatBtn.href = waLink(msg);

  // Venta online pausada: no hay bloque de compra en ninguna marca por ahora
  // (ver data/prices-publico.json). TIENDA.init() se llama igual porque el
  // carrito del header lo necesita si queda algo guardado de antes de la
  // pausa — así el visitante puede vaciarlo, no vender más equipos acá.
  TIENDA.init().catch(() => {});

  // Precio en la ficha (sólo equipos con precio público; ver data/prices-publico.json)
  ensureCardPrices().then(() => {
    const el = document.getElementById('pd-price');
    if (el) el.innerHTML = cardPriceHtml(p.sku, true);
  }).catch(() => {});

  // related
  const related = CATALOG.products
    .filter(x => x.slug !== p.slug && (x.category === p.category))
    .slice(0, 4);
  renderGrid('#related', related);
})();
</script>
</body>
</html>
