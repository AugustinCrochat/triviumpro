<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="assets/img/icono-trivium.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tv-root" content="">
<title>Categoría — Trivium Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<section class="cat-hero">
  <div class="container">
    <div class="breadcrumbs" id="crumbs"></div>
    <h1 id="cat-title">—</h1>
    <div class="sub">
      <span class="chip" id="cat-tag">—</span>
      <span class="mono muted" id="cat-count">—</span>
    </div>
  </div>
</section>

<section>
  <div class="container cat-layout">
    <aside class="sidebar">
      <h4>Categorías</h4>
      <ul id="cat-list"></ul>
      <h4>Marcas</h4>
      <ul id="brand-list"></ul>
    </aside>
    <div>
      <div class="results-head">
        <span class="count" id="count">—</span>
        <span class="mono muted">Ordenar: recomendados</span>
      </div>
      <div class="prod-grid" id="grid"></div>
    </div>
  </div>
</section>

<section class="cat-faq" id="cat-faq"></section>
<section class="cat-blog-links" id="cat-posts"></section>

<div id="site-footer"></div>
<script src="assets/js/site.js"></script>
<script>
mountChrome('catalogo');
(async () => {
  await loadCatalog();
  const catSlug = getQuery('c');
  const brandSlug = getQuery('b');
  let results = [];
  let title = '', sub = '', crumb = '';

  if (catSlug) {
    const cat = categoryById(catSlug);
    const subs = CATALOG.categories.filter(c => c.parent === catSlug).map(c => c.slug);
    results = CATALOG.products.filter(p => p.category === catSlug || subs.includes(p.category));
    if (catSlug === 'elevadores' || brandSlug) {
      const order = ['elevadores-2-columnas', 'elevadores-4-columnas', 'elevadores-tijera', 'elevadores-pesados', 'elevadores-motos'];
      results.sort((a, b) => {
        const ia = order.indexOf(a.category);
        const ib = order.indexOf(b.category);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
    }
    // seo_name es el nombre largo para H1 y <title> ("Elevadores de Tijera");
    // name es el corto del menú, donde ya cuelga de "Elevadores".
    const largo = cat.seo_name || cat.name;
    title = largo; sub = cat.tagline || ''; crumb = cat.name;
    document.title = `${largo} — Trivium Pro`;
  } else if (brandSlug) {
    const br = brandById(brandSlug);
    results = CATALOG.products.filter(p => p.brand === brandSlug);
    if (brandSlug === 'direct-lift') {
      results.sort((a, b) => {
        if (a.slug.includes('dl9')) return -1;
        if (b.slug.includes('dl9')) return 1;
        const isMotoA = a.category === 'elevadores-motos';
        const isMotoB = b.category === 'elevadores-motos';
        if (isMotoA && !isMotoB) return 1;
        if (!isMotoA && isMotoB) return -1;
        return 0;
      });
    }
    title = br.name; sub = br.note || ''; crumb = br.name;
    document.title = `${br.name} — Trivium Pro`;
  }

  document.getElementById('cat-title').innerHTML = title.replace(/(\S+)$/, '<span style="color:var(--accent)">$1</span>');
  document.getElementById('cat-count').textContent = `${results.length} productos`;
  document.getElementById('count').textContent = `${results.length} resultados`;

  if (brandSlug) {
    document.getElementById('crumbs').innerHTML = '';
    document.querySelector('.cat-hero').style.padding = '28px 0 24px';
    const origin = sub.split(' — ')[0];
    const tagEl = document.getElementById('cat-tag');
    tagEl.textContent = origin;
    tagEl.className = 'chip chip--yellow';
  } else {
    document.getElementById('cat-tag').textContent = sub || 'Trivium';
    document.getElementById('crumbs').innerHTML = `<a href="${rootPath()}">Inicio</a><span>/</span><a href="${rootPath()}catalogo/">Catálogo</a><span>/</span>${crumb}`;
  }

  // Sidebar
  const topCats = CATALOG.categories.filter(c => !c.parent);
  document.getElementById('cat-list').innerHTML = topCats.map(c => {
    const subs = CATALOG.categories.filter(s => s.parent === c.slug).map(s => s.slug);
    const count = CATALOG.products.filter(p => p.category === c.slug || subs.includes(p.category)).length;
    const active = c.slug === catSlug ? 'active' : '';
    return `<li><a class="${active}" href="${categoryUrl(c.slug)}">${c.name}<b>${count}</b></a></li>`;
  }).join('');

  document.getElementById('brand-list').innerHTML = CATALOG.brands.map(b => {
    const count = CATALOG.products.filter(p => p.brand === b.slug).length;
    const active = b.slug === brandSlug ? 'active' : '';
    return `<li><a class="${active}" href="${brandUrl(b.slug)}">${b.name}<b>${count}</b></a></li>`;
  }).join('');

  renderGrid('#grid', results);
})();
</script>
</body>
</html>
